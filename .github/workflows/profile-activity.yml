name: Refresh GitHub profile cards

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_profile.py"
      - ".github/workflows/profile-activity.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render contribution cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Gurjyot-gurz
        run: python scripts/render_profile.py
      - name: Commit updated SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub profile activity cards"
          git push
